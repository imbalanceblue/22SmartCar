# M1-2 统一参数文件
#
# /** 通配"任意命名空间下的任意节点",所以 robot1/filter_node 和
# robot2/filter_node 会读到同一份参数。各节点只会取自己声明过的键,
# 与本节点无关的键留在 overrides 里,不会报错。
/**:
  ros__parameters:
    # ---------- 节点A:传感器 ----------
    publish_rate: 10.0     # 发布频率 Hz
    wave_period: 6.0       # 距离变化一个周期(s)
    center: 0.55           # 距离中心值(m)
    amplitude: 0.35        # 波动幅度(m) -> 0.20~0.90m
    noise_std: 0.05        # 高斯噪声标准差(m),让滤波效果可见
    fault_every: 0         # 每 N 帧注入一次异常,0=关闭
    seed: 0                # 噪声种子,固定则每次运行一致

    # ---------- 节点B:滤波 ----------
    # 故意设成 0.45(代码默认 0.3):验收时若看到 alpha=0.45
    # 就能确定参数确实来自本文件,而不是代码里的默认值
    alpha: 0.45
    log_every: 10          # 每 N 条打印一行(10Hz -> 1Hz)

    # ---------- 节点C:报警 ----------
    alarm_threshold: 0.3   # 报警阈值(m),会被 launch 按命名空间覆盖
    cooldown: 2.0          # 两次报警最小间隔(s)
    service_timeout: 1.0   # 服务调用超时(s)
    server_delay: 0.0      # 服务端模拟延迟(s),演示超时用
