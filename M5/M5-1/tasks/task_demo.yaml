# M5-1 自带示例:覆盖顺序 / 重试 / 降级 / 超时 / 并发 五种情形。
# 运行:python run_task.py tasks/task_demo.yaml
# duration 是 mock 节点的模拟耗时(秒),真实节点忽略此字段。
mission_id: grab_and_return
deadline: null            # 任务级截止时间(秒);本例不设。设了超时会判 TIMEOUT

tasks:
  - name: wait_start
    type: WaitForTrigger
    timeout: 30           # 步骤级超时:等口令最多 30s
    duration: 0.1

  - name: navigate_to_scan
    type: NavigateTo
    pose: [0.0, 0.0, 0.0]
    duration: 0.2
    retry: 2              # 失败重试 2 次(共 3 次尝试)
    retry_interval: 0.1
    fallback: wait_start  # 仍失败则降级回等口令

  - name: detect_qr
    type: DetectTarget
    target_class: "qrcode"
    min_confidence: 0.7
    timeout: 15
    retry: 2
    fallback: navigate_to_scan   # 降级链:detect_qr -> navigate_to_scan -> wait_start

  - name: cruise_and_avoid
    type: Parallel
    timeout: 10           # 整体超时;分支自身超时由各自 timeout 控制
    branches:
      - name: follow_line
        type: NavigateTo
        pose: [2.0, 1.0, 0.0]
        duration: 0.3
      - name: avoid_obstacle
        type: DetectTarget
        target_class: "obstacle"
        min_confidence: 0.5
        duration: 0.5

  - name: navigate_to_grasp
    type: NavigateTo
    pose_from_context: target_pose   # 目标位置由上游 detect_qr 写入上下文
    retry: 1
    duration: 0.2

  - name: grasp
    type: ExecuteGrasp
    grasp_type: "top_down"
    retry: 2
    fallback: navigate_to_grasp
    duration: 0.2

  - name: navigate_to_place
    type: NavigateTo
    pose: [5.0, 5.0, 0.0]
    duration: 0.2

  - name: speak_done
    type: SpeakTTS
    text: "任务完成"
    duration: 0.1
